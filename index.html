<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catholic Religious Houses Directory - Version 1.1 (MVP)</title>
    <meta name="description" content="A directory of all Catholic religious houses (monasteries, abbeys, convents, oratories) in North America, searchable by Rite, Order, and location.">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/SJPMe+HoISo5jT/W8="
    crossorigin=""/>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>🧭 North American Catholic Religious Houses Directory</h1>
        <p>A directory of houses across the 24 Catholic Churches (Rites). MVP Version 1.1.</p>
    </header>

    <main>
        
        <div class="tabs">
            <button class="tab-button active" onclick="showView('list-view')">List View</button>
            <button class="tab-button" onclick="showView('map-view')">Map View</button>
        </div>
        
        <section id="controls">
            <h2>🔎 Filters & Sorting</h2>
            
            <label for="search-bar">Search by Name:</label>
            <input type="text" id="search-bar" placeholder="e.g., St. Joseph's Abbey" oninput="filterAndRender()">

            <label for="sort-by">Sort By:</label>
            <select id="sort-by" onchange="filterAndRender()">
                <option value="name-asc">Name (A-Z)</option>
                <option value="year-asc">Year Founded (Oldest First)</option>
                <option value="year-desc">Year Founded (Newest First)</option>
                <option value="state-asc">State/Province</option>
            </select>

            <label for="filter-rite">Church Rite:</label>
            <select id="filter-rite" onchange="filterAndRender()">
                <option value="all">All Rites</option>
                </select>
            
            <label for="filter-gender">Gender:</label>
            <select id="filter-gender" onchange="filterAndRender()">
                <option value="all">Men's & Women's</option>
                <option value="mens">Men's Houses</option>
                <option value="womens">Women's Houses</option>
            </select>
            
            <label for="filter-cloistered">Status:</label>
            <select id="filter-cloistered" onchange="filterAndRender()">
                <option value="all">All Houses</option>
                <option value="true">Cloistered</option>
                <option value="false">Apostolic/Non-Cloistered</option>
            </select>
        </section>

        <hr>

        <section id="list-view" class="view-content active">
            <h2>🏠 Houses Found: <span id="house-count">0</span></h2>
            <div id="monastery-list">
                <p>Loading directory data...</p>
            </div>
        </section>

        <section id="map-view" class="view-content" style="display: none;">
            <h2>🗺️ North America Map</h2>
            <div id="map"></div>
        </section>
        
    </main>

    <footer>
        <p>&copy; 2025 Catholic Religious Houses Directory. Data verification in progress.</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20n6h+A/O9F0V6/bLd5P2pP8l+T5fFk5v6E9aX7Q/9k="
    crossorigin=""></script>
    
    <script src="script.js"></script>
</body>
</html>
